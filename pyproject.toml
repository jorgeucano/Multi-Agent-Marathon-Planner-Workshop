[project]
name = "marathon-agents"
version = "0.1.0"
description = "Multi-agent marathon planning system with ADK, A2A, and Vertex AI Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Techos deliberados: el codelab declara solo pisos (>=) y hoy eso resuelve
    # a google-adk 2.x / a2a-sdk 1.x / aiplatform 2.x, donde `vertexai.types`,
    # `a2a.server.apps` y `a2a.types.TransportProtocol` ya no existen.
    # Ver docs/GOTCHAS.md #10.
    "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.121.0,<2",
    "google-adk>=1.25.0,<2",
    "a2a-sdk>=0.3.9,<1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "google-auth>=2.0.0",
    "pandas>=2.0.0",
    "folium>=0.17.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
